[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xingintent-sdk"
version = "0.1.0"
description = "Intent recognition SDK for XingIntent models"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.8"
authors = [
    {name = "XingIntent Team"},
]
keywords = ["intent-recognition", "nlp", "llm", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.24",
]

[project.urls]
Homepage = "https://github.com/XingChen-AGI/Xing4.0-29B-Intent"
Repository = "https://github.com/XingChen-AGI/Xing4.0-29B-Intent"
Issues = "https://github.com/XingChen-AGI/Xing4.0-29B-Intent/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["xingintent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
